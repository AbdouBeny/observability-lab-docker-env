groups:
  - name: e-commerce-alerts
    rules:
      # Alerte si le taux d'erreur HTTP 5xx devient trop élevé sur l'API Gateway
      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[1m])) > 0.5
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "Taux d'erreur élevé détecté sur l'API Gateway"
          description: "L'API Gateway renvoie trop d'erreurs HTTP 5xx depuis plus de 10 secondes."

      # Alerte si un service met trop de temps à répondre
      - alert: ServiceSlow
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (le)) > 2.0
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: "Ralentissement détecté"
          description: "La latence P95 dépasse 2 secondes."
