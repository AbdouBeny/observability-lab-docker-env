global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  # ajout de l'API Gateway pour récupérer ses métriques Prometheus
  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8000']
