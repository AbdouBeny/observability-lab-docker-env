apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

    jsonData:
      httpMethod: GET
      exemplarTraceIdDestinations:
        - name: traceID 
          datasourceUid: tempo
          urlDisplayLabel: 'Trace ID'
          url: '${__exemplar.traceID}'
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false

    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: 'trace_id=([a-fA-F0-9]+)'
          url: '$${__value.raw}'
          datasourceUid: tempo

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false

    jsonData:
      httpMethod: GET

      serviceMap:
        datasourceUid: prometheus

      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
        filterByTraceID: true
        filterBySpanID: false
        customQuery: true
        query: '{service_name="$${__span.tags["service.name"]}"} |= "$${__trace.traceId}"'
